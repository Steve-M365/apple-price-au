[project]
name = "apple-price-au"
version = "0.1.0"
description = "Orchard - Australia-only Apple price tracker and deal updater"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site", "node_modules", "data/snapshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["site/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that reach the internet (deselected by default)",
    "fixture: tests that parse saved retailer HTML",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/models/export_schema.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
name: deploy-site

# Publishes the static site to GitHub Pages. Deployment is gated on the same
# data validation the update workflows use, so a schema failure can never
# reach the public site.
#
# Pages is configured as "Deploy from a branch" -> this is WRONG for this
# workflow; the repository must have Pages source "GitHub Actions". See
# docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "config/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel a deploy halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://steve-m365.github.io/apple-price-au' }}

jobs:
  validate:
    name: Gate on data validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # No --strict until APA-030 lands the adapter framework; the same
      # handover comment appears in validate-data.yml.
      - name: Validate datasets
        run: uv run python -m scripts.validation.validate_data

  build:
    name: Build the static site
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4